services:
  wordpress:
    image: ${WORDPRESS_IMAGE:-mmilesmm/wordpress-apache-php-fix:latest}
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:?Set DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER:?Set DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'wordpress-redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_DATABASE', ${REDIS_DATABASE:-0});
        define('WP_REDIS_PREFIX', '${SITE_SLUG}:');
        define('WP_CACHE_KEY_SALT', '${SITE_SLUG}:');
    volumes:
      - ./wordpress_data:/var/www/html
      - ../../config/wordpress.ini:/usr/local/etc/php/conf.d/wordpress.ini:ro
    ports:
      - "127.0.0.1:${WEB_PORT:?Set WEB_PORT}:80"
    networks:
      - wordpress-backend
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",80,$$e,$$m,2); exit($$s?0:1);'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  wordpress-backend:
    external: true
    name: wordpress-backend
